name: Prerelease

on:
  push:
    branches: [alpha, beta, next]

jobs:
  quality:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node-version: [22.x]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.2
          run_install: |
            - recursive: true
              args: [--frozen-lockfile, --strict-peer-dependencies]
            - args: [--global, gulp, prettier, typescript]
      - name: Run tests
        run: |
          pnpm build:bus
          pnpm build:core
          pnpm test
          pnpm build:vue

          pnpm build:w-oruga
          pnpm build:w-vuetify
          pnpm build:w-quasar
          pnpm build:w-element
          pnpm build:w-primevue

          pnpm build:p-rule-parsers
          pnpm build:p-vue3-toastify

  compute-new-tag-version:
    needs: quality
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      fromTag: ${{ steps.fromTag.outputs.tag }}
      toTag: ${{ steps.toTag.outputs.tag }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 'Get Previous tag'
        id: fromTag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"

      - name: Installing python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Installing poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: '1.6.1'

      - name: Install deps
        run: poetry install

      - name: Run matic-release
        run: poetry run python scripts/release.py --ci

      # The tag is deliberately not pushed here. matic-release creates it
      # locally, which is all toTag below needs, and pushing it before the
      # publish succeeds makes the next run compute toTag == fromTag and skip
      # publishing altogether. It is pushed by the push-tag job instead.
      - name: 'Get lastest tag'
        id: toTag
        uses: "WyriHaximus/github-action-get-previous-tag@v1"

  publish:
    runs-on: ubuntu-latest
    needs: compute-new-tag-version
    if: ${{ needs.compute-new-tag-version.outputs.fromTag != needs.compute-new-tag-version.outputs.toTag }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: install pnpm
        run: npm i pnpm@10.18.2 -g

      - name: Setup npmrc
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > .npmrc

      # npm answers 404 to a PUT when the credential cannot write to the scope,
      # so an auth failure is indistinguishable from a missing package at publish
      # time. Resolve it here instead, before the build.
      - name: Verify npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty: the secret is not reaching this job."
            exit 1
          fi
          echo "Token length: ${#NPM_TOKEN}"

          if ! npm whoami; then
            echo "::error::The token cannot authenticate against the registry: expired, revoked, or not a valid npm token."
            exit 1
          fi

          npm access list packages @fancy-crud \
            || echo "::warning::Could not list the @fancy-crud packages. The token authenticates but may not carry write access to the scope."

      - name: setup pnpm config
        run: pnpm config set store-dir $PNPM_CACHE_FOLDER

      - name: install dependencies
        run: pnpm install

      - name: Build and publish
        run: |
          pnpm -w run release ${{ needs.compute-new-tag-version.outputs.toTag }}
          pnpm build:bus
          pnpm build:core
          pnpm build:vue

          pnpm build:w-oruga
          pnpm build:w-vuetify
          pnpm build:w-quasar
          pnpm build:w-element
          pnpm build:w-primevue

          pnpm build:p-rule-parsers
          pnpm build:p-vue3-toastify
          pnpm --filter "./packages/**" publish --no-git-checks --tag ${{ github.ref_name }}

  push-tag:
    runs-on: ubuntu-latest
    needs:
      - compute-new-tag-version
      - publish
    if: ${{ needs.compute-new-tag-version.outputs.fromTag != needs.compute-new-tag-version.outputs.toTag }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push the release tag
        env:
          TAG: ${{ needs.compute-new-tag-version.outputs.toTag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already on the remote, nothing to push."
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"

  generate-release:
    runs-on: ubuntu-latest
    needs:
      - compute-new-tag-version
      - publish
      - push-tag
    if: ${{ needs.compute-new-tag-version.outputs.fromTag != needs.compute-new-tag-version.outputs.toTag }}
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v1

      - name: Run git-cliff
        run: |
          {
            echo 'CHANGELOG<<EOF'
            git cliff --latest
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ env.CHANGELOG }}
          prerelease: true
          tag_name: ${{ needs.compute-new-tag-version.outputs.toTag }}
